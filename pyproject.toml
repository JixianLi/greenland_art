[project]
name = "greenland_art"
version = "0.1.0"
description = "Multi-sensory artistic exploration of Greenland Ice Sheet data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "xarray",
    "dask",
    "zarr",
    "numpy",
    "pandas",
    "matplotlib",
    "holoviews",
    "hvplot",
    "panel",
    "bokeh",
    "umap-learn",
    "scikit-learn",
    "librosa",
    "notebook",
    "cdsapi>=0.7.7",
    "netcdf4>=1.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
